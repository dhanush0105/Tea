<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tea Visit Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-color: #f7f9fb;
      --text-color: #000;
      --card-bg: #fff;
      --btn-bg: #3498db;
      --btn-color: #fff;
    }
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #fff;
      --card-bg: #1e1e1e;
      --btn-bg: #2980b9;
      --btn-color: #fff;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    .card { background: var(--card-bg); padding: 20px; margin: 15px 0; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .btn { padding: 10px 15px; margin: 5px 5px 5px 0; background: var(--btn-bg); color: var(--btn-color); border: none; border-radius: 4px; cursor: pointer; }
    .btn.stop { background: #e74c3c; }
    .btn.clear { background: #95a5a6; }
    .map { height: 300px; border-radius: 6px; }
    input, select { padding: 8px; width: 100%; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; }
    .error { color: red; margin-top: 10px; }
    .history-item { border-bottom: 1px solid #eee; padding: 8px 0; }
    .history-item:last-child { border-bottom: none; }
    label { font-size: 0.9em; display: block; margin-bottom: 5px; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2ecc71;
      color: #fff;
      padding: 12px 20px;
      border-radius: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      font-weight: bold;
      animation: fadeOut 3s forwards;
      z-index: 999;
    }
    @keyframes fadeOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Toast = ({ message }) => {
      useEffect(() => {
        const timer = setTimeout(() => {
          ReactDOM.unmountComponentAtNode(document.getElementById('toast-root'));
        }, 3000);
        return () => clearTimeout(timer);
      }, []);
      return <div className="toast">{message}</div>;
    };

    const showToast = (msg) => {
      ReactDOM.render(<Toast message={msg} />, document.getElementById('toast-root'));
    };

    const App = () => {
      const [map, setMap] = useState(null);
      const [marker, setMarker] = useState(null);
      const [locationHistory, setLocationHistory] = useState([]);
      const [currentLocation, setCurrentLocation] = useState(null);
      const [isTracking, setIsTracking] = useState(false);
      const intervalRef = useRef(null);

      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [users, setUsers] = useState([]);
      const [error, setError] = useState('');
      const [theme, setTheme] = useState('system');

      const [showRegPassword, setShowRegPassword] = useState(false);
      const [showLoginPassword, setShowLoginPassword] = useState(false);

      const COST_PER_TEA = 15;

      useEffect(() => {
        const savedTheme = localStorage.getItem('theme') || 'system';
        setTheme(savedTheme);
        applyTheme(savedTheme);
      }, []);

      const applyTheme = (mode) => {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const finalMode = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
        document.documentElement.setAttribute('data-theme', finalMode);
      };

      const handleThemeChange = (e) => {
        const newTheme = e.target.value;
        setTheme(newTheme);
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
      };

      useEffect(() => {
        const savedUsers = JSON.parse(localStorage.getItem('users')) || [];
        const savedHistory = JSON.parse(localStorage.getItem('locationHistory')) || [];
        const savedUser = JSON.parse(localStorage.getItem('loggedInUser'));
        setUsers(savedUsers);
        setLocationHistory(savedHistory);
        if (savedUser) {
          setIsLoggedIn(true);
          setUsername(savedUser.username);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('users', JSON.stringify(users));
        localStorage.setItem('locationHistory', JSON.stringify(locationHistory));
      }, [users, locationHistory]);

      const validatePassword = (pass) => /[A-Z]/.test(pass) && /[0-9]/.test(pass) && /[!@#$%^&*]/.test(pass) && pass.length >= 8;

      const handleRegister = () => {
        if (!validatePassword(password)) {
          setError("Password must have 8+ characters, 1 uppercase, 1 number, 1 special character.");
          return;
        }
        if (users.find(u => u.username === username)) {
          setError("Username already exists.");
          return;
        }
        const newUser = { username, password };
        setUsers([...users, newUser]);
        setIsLoggedIn(true);
        localStorage.setItem('loggedInUser', JSON.stringify(newUser));
        setError('');
      };

      const handleLogin = () => {
        const user = users.find(u => u.username === loginUser && u.password === loginPass);
        if (user) {
          setIsLoggedIn(true);
          setUsername(user.username);
          localStorage.setItem('loggedInUser', JSON.stringify(user));
          setError('');
        } else {
          setError("Invalid login.");
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setUsername('');
        localStorage.removeItem('loggedInUser');
      };

      const reverseGeocode = async (lat, lng) => {
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
          const data = await response.json();
          return data.display_name || `Lat: ${lat}, Lng: ${lng}`;
        } catch {
          return `Lat: ${lat}, Lng: ${lng}`;
        }
      };

      const getAndRecordLocation = () => {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;
            const time = new Date().toLocaleString();
            const locationName = await reverseGeocode(latitude, longitude);
            setCurrentLocation({ latitude, longitude, time, name: locationName });
            setLocationHistory(prev => [{ name: locationName, time }, ...prev]);

            if (map && marker) {
              marker.setLatLng([latitude, longitude]);
              map.setView([latitude, longitude], 16);
            }
          },
          (err) => alert("Location error: " + err.message),
          { enableHighAccuracy: true }
        );
      };

      const startTracking = () => {
        if (!navigator.geolocation) {
          alert("Geolocation not supported.");
          return;
        }
        setIsTracking(true);
        showToast("📍 Tracking Started");
        getAndRecordLocation();
        intervalRef.current = setInterval(getAndRecordLocation, 15 * 60 * 1000);
      };

      const stopTracking = () => {
        clearInterval(intervalRef.current);
        setIsTracking(false);
        showToast("🛑 Tracking Stopped");
      };

      const clearAllData = () => {
        if (window.confirm("Clear all tracking data?")) {
          setLocationHistory([]);
          localStorage.removeItem('locationHistory');
          setCurrentLocation(null);
        }
      };

      useEffect(() => {
        if (currentLocation && !map) {
          const leafletMap = L.map("map").setView([currentLocation.latitude, currentLocation.longitude], 15);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; OpenStreetMap contributors',
          }).addTo(leafletMap);
          const newMarker = L.marker([currentLocation.latitude, currentLocation.longitude])
            .addTo(leafletMap)
            .bindPopup("You are here.")
            .openPopup();
          setMap(leafletMap);
          setMarker(newMarker);
        }
      }, [currentLocation]);

      const totalExpense = locationHistory.length * COST_PER_TEA;

      return (
        <div className="container">
          <h1>🍵 Tea Visit Tracker</h1>
          <label>Theme:
            <select value={theme} onChange={handleThemeChange}>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="system">System</option>
            </select>
          </label>

          {!isLoggedIn ? (
            <div className="card">
              <h2>Register</h2>
              <input placeholder="Username" value={username} onChange={e => setUsername(e.target.value)} />
              <input type={showRegPassword ? "text" : "password"} placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} />
              <label><input type="checkbox" onChange={() => setShowRegPassword(p => !p)} /> Show Password</label>
              <button className="btn" onClick={handleRegister}>Register</button>
              <hr />
              <h2>Login</h2>
              <input placeholder="Username" value={loginUser} onChange={e => setLoginUser(e.target.value)} />
              <input type={showLoginPassword ? "text" : "password"} placeholder="Password" value={loginPass} onChange={e => setLoginPass(e.target.value)} />
              <label><input type="checkbox" onChange={() => setShowLoginPassword(p => !p)} /> Show Password</label>
              <button className="btn" onClick={handleLogin}>Login</button>
              {error && <div className="error">{error}</div>}
            </div>
          ) : (
            <>
              <div className="card">
                <p>Welcome, <strong>{username}</strong>!</p>
                <button className="btn stop" onClick={handleLogout}>Logout</button>
              </div>

              <div className="card">
                <h2>Track Your Visits</h2>
                <button className="btn" onClick={startTracking} disabled={isTracking}>Start Tracking</button>
                <button className="btn stop" onClick={stopTracking} disabled={!isTracking}>Stop Tracking</button>
                <button className="btn clear" onClick={clearAllData}>Clear Data</button>
              </div>

              <div className="card">
                <h2>Map View</h2>
                <div id="map" className="map"></div>
              </div>

              <div className="card">
                <h2>Total Expense</h2>
                <p>Visits: <strong>{locationHistory.length}</strong></p>
                <p>Total Spent: ₹<strong>{totalExpense}</strong></p>
              </div>

              <div className="card">
                <h2>Visit History</h2>
                {locationHistory.length === 0 ? <p>No visits yet.</p> : (
                  locationHistory.map((loc, i) => (
                    <div key={i} className="history-item">
                      #{locationHistory.length - i}:<br />
                      📍 <strong>{loc.name}</strong><br />
                      🕒 <small>{loc.time}</small><br />
                      💰 ₹{COST_PER_TEA}
                    </div>
                  ))
                )}
              </div>
            </>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
